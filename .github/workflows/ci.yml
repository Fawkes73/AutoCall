name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate-design-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose syntax
        run: docker compose config

      - name: Validate PostgreSQL schema can be parsed
        run: |
          docker run --rm -d --name autocall-pg -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=autocall -p 5432:5432 pgvector/pgvector:pg16
          for i in {1..30}; do docker exec autocall-pg pg_isready -U postgres -d autocall && break || sleep 2; done
          docker cp database/schema.sql autocall-pg:/tmp/schema.sql
          docker exec autocall-pg psql -U postgres -d autocall -v ON_ERROR_STOP=1 -f /tmp/schema.sql
          docker rm -f autocall-pg

      - name: Check backup script shell syntax
        run: bash -n scripts/backup_postgres.sh
